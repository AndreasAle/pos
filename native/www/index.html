<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0B1B3F">
    <title>Yoka POS</title>
    <style>
        :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px; background: #f8fafc; color: #0b1b3f; }
        main { width: min(100%, 420px); padding: 32px; border: 1px solid #e2e8f0; border-radius: 20px; background: white; text-align: center; box-shadow: 0 18px 45px rgba(11, 27, 63, .08); }
        img { width: 72px; height: 72px; object-fit: contain; }
        h1 { margin: 20px 0 8px; font-size: 24px; }
        p { margin: 0; color: #64748b; line-height: 1.6; }
        code { display: inline-block; margin-top: 18px; padding: 8px 12px; border-radius: 10px; background: #ecfdf5; color: #15803d; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <img src="yoka-icon.png" alt="Yoka POS">
        <h1>Yoka POS Lokal</h1>
        <p>Jalankan Laravel di Mac agar aplikasi dapat terhubung.</p>
        <code>php artisan serve</code>
    </main>
</body>
</html>
